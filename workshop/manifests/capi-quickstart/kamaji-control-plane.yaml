apiVersion: controlplane.cluster.x-k8s.io/v1alpha2
kind: KamajiControlPlane
metadata:
  name: capi-quickstart-kubevirt
  namespace: default
spec:
  dataStoreName: default
  addons:
    coreDNS: {}
    kubeProxy: {}
  kubelet:
    cgroupfs: systemd
    preferredAddressTypes:
    - InternalIP
    - ExternalIP
    # Kamaji edge generates the KubeletConfiguration with newer Kubernetes defaults:
    # these fields are feature-gated (and disabled) in a v1.34 kubelet.
    configurationJSONPatches:
    - op: remove
      path: /crashLoopBackOff
    - op: remove
      path: /imagePullCredentialsVerificationPolicy
  network:
    serviceType: LoadBalancer
  replicas: 2
  version: v1.34.1
